</div>



<a href="checkout.html" class="cart top-cart">

<input

type="text"

id="search"

placeholder="Search products / ድለ..."

<button onclick="filterProducts('all')">

All / ኩሎም

</button>

<button onclick="filterProducts('cosmetics')">

Cosmetics / ኮስሞቲክስ

</button>



<button onclick="filterProducts('electronics')">

Electronics / ኤሌክትሮኒክ

</button>

Building / ህንፃ መሳርሒ
