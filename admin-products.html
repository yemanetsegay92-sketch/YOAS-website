<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YOAS Admin - Products</title>

<link rel="stylesheet" href="admin.css">

<script src="products.js"></script>

</head>

<body>

<header class="header">

<div class="logo">
<h1>YOAS</h1>
<p>Admin Product Management</p>
</div>

<div>

<a href="admin-dashboard.html" class="btn">
🏠 Dashboard
</a>

<a href="admin-product-form.html" class="btn add-btn">
➕ Add Product
</a>

</div>

</header>


<section class="container">

<div class="top-bar">

<h2>📦 Products</h2>

<input
type="text"
id="search"
placeholder="Search product..."
onkeyup="searchProducts()">

</div>

<p class="total">

Total Products:
<span id="total-products"></span>

</p>

<div id="product-list" class="product-grid">

</div>

</section>

<script type="module">
import { db } from "./firebase.js";
import {
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

if(localStorage.getItem("adminLogin")!=="true"){

window.location.href="admin-login.html";

}

let productList=document.getElementById("product-list");

let totalProducts=document.getElementById("total-products");

function loadProducts(data){

productList.innerHTML="";

totalProducts.textContent=data.length;

data.forEach(product=>{

let options = "";

if (product.options && Array.isArray(product.options)) {

    product.options.forEach(option => {

        options += `
<li>${option.unit} - ${option.price} Birr</li>
`;

    });

}

productList.innerHTML+=`

<div class="card">

<img src="${product.image || 'images/default.jpg'}" class="product-image">

<h3>${product.name}</h3>

<p class="tig">${product.tigrinya}</p>

<p><strong>Brand:</strong> ${product.brand}</p>

<p><strong>Category:</strong> ${product.category}</p>

<p><strong>Price Options</strong></p>

<ul>

${options}

</ul>

<div class="buttons">

<button class="edit-btn"
onclick="editProduct('${product.firebaseId}')">

✏️ Edit

</button>

<button class="delete-btn"
onclick="deleteProduct('${product.firebaseId}')">

🗑 Delete

</button>

</div>

</div>

`;

});

}



async function loadProductsFromFirebase(){

    const snapshot = await getDocs(collection(db, "products"));

    let allProducts = [];

    snapshot.forEach((doc) => {

        allProducts.push({
    firebaseId: doc.id,
    ...doc.data()
});

    });

    loadProducts(allProducts);
console.log(allProducts);
}

loadProductsFromFirebase();

async function searchProducts(){

    let keyword = document
    .getElementById("search")
    .value
    .toLowerCase();

    const snapshot = await getDocs(collection(db, "products"));

    let allProducts = [];

    snapshot.forEach((doc) => {

        allProducts.push({
    firebaseId: doc.id,
    ...doc.data()
});

    });

    let filtered = allProducts.filter(product =>

        product.name.toLowerCase().includes(keyword)

        ||

        product.tigrinya.toLowerCase().includes(keyword)

        ||

        product.category.toLowerCase().includes(keyword)

        ||

        product.brand.toLowerCase().includes(keyword)

    );

    loadProducts(filtered);

}




</script>
<script type="module" src="admin.js"></script>
</body>

</html>
