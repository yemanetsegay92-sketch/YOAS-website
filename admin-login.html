<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YOAS Admin Login</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<section class="checkout">


<h2>
YOAS Admin Login
</h2>


<input 
type="email"
id="admin-email"
placeholder="Admin Email"
/>


<input 
type="password"
id="admin-password"
placeholder="Password"
/>


<button onclick="adminLogin()">
Login
</button>


<p id="login-message"></p>


</section>



<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyANRflBP3P1sGB9gwXfzGDoiihrbQ9imxg",
  authDomain: "yoas-e1fe2.firebaseapp.com",
  projectId: "yoas-e1fe2",
  storageBucket: "yoas-e1fe2.firebasestorage.app",
  messagingSenderId: "768983650819",
  appId: "1:768983650819:web:599e67f17e8a7f93a4f436",
  measurementId: "G-HHL5HV0TNS"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);



window.adminLogin = function(){


let email =
document.getElementById("admin-email").value.trim();


let password =
document.getElementById("admin-password").value;



signInWithEmailAndPassword(auth, email, password)

.then((userCredential)=>{


window.location.href="admin-dashboard.html";


})


.catch((error)=>{


document.getElementById("login-message").innerHTML =
"Wrong email or password";


});


}


</script>



</body>

</html>
