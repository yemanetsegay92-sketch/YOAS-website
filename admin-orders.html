<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YOAS Admin - Orders</title>

<link rel="stylesheet" href="admin.css">

</head>


<body>


<header class="header">

<div class="logo">

<h1>YOAS</h1>

<p>Order Management</p>

</div>


<div>

<a href="admin-dashboard.html" class="btn">
🏠 Dashboard
</a>

<a href="admin-products.html" class="btn">
📦 Products
</a>

</div>

</header>




<section class="container">


<h2>
🛒 Customer Orders
</h2>


<div id="orders-container">

</div>


</section>





<script type="module">

import { auth, db } from "./firebase.js";

import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
    collection,
    getDocs,
    updateDoc,
    deleteDoc,
    doc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

onAuthStateChanged(auth, (user) => {

    if (!user) {

        window.location.href = "admin-login.html";

    }

});



async function loadOrders(){

let orders = [];

const snapshot = await getDocs(collection(db, "orders"));

snapshot.forEach((doc) => {

    orders.push({
        firebaseId: doc.id,
        ...doc.data()
    });

});



let container =
document.getElementById("orders-container");



container.innerHTML = "";



if(orders.length === 0){


container.innerHTML = `

<div class="card">

<h3>No Orders Yet</h3>

<p>
Orders from customers will appear here.
</p>

</div>

`;

return;


}




[...orders].reverse().forEach(order => {



let items = "";



order.items.forEach(item => {


items += `

<li>

${item.name}

(${item.unit})

-

${item.quantity} x ${item.price} Birr

</li>

`;

});





container.innerHTML += `


<div class="card">


<h3>

📦 ${order.id}

</h3>


<p>

<b>Customer:</b>
${order.customer.name}

</p>



<p>

<b>Phone:</b>
${order.customer.phone}

</p>



<p>

<b>Address:</b>
${order.customer.address}

</p>



<h4>
Products:
</h4>


<ul>

${items}

</ul>



<p>

<b>Total:</b>
${order.total} Birr

</p>



<p>

<b>Date:</b>
${order.date}

</p>



<label>

Status:

</label>

<select onchange="changeStatus('${order.firebaseId}', this.value)">


<option ${order.status=="Pending"?"selected":""}>
Pending
</option>


<option ${order.status=="Preparing"?"selected":""}>
Preparing
</option>


<option ${order.status=="Out for Delivery"?"selected":""}>
Out for Delivery
</option>


<option ${order.status=="Delivered"?"selected":""}>
Delivered
</option>


</select>


<br><br>

<button onclick="deleteOrder('${order.firebaseId}')">
🗑 Delete Order
</button>


</div>


`;



});



}




async function changeStatus(id,status){

const orderRef = doc(db,"orders",id);

await updateDoc(orderRef,{
    status: status
});

alert("Order status updated ✅");

loadOrders();

}

async function deleteOrder(id){

await deleteDoc(
    doc(db,"orders",id)
);

alert("Order deleted ✅");

loadOrders();

}

loadOrders();

window.changeStatus = changeStatus;
window.deleteOrder = deleteOrder;
</script>


</body>

</html>
