<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YOAS Admin - Add Product</title>

<link rel="stylesheet" href="admin.css">

</head>


<body>


<header class="header">

<div class="logo">

<h1>YOAS</h1>
<p>Add / Edit Product</p>

</div>


<a href="admin-products.html" class="btn">
⬅ Back Products
</a>


</header>




<section class="container">


<h2>➕ Product Information</h2>


<form id="product-form">


<label>
Product Name
</label>

<input 
type="text"
id="name"
placeholder="Example: Cooking Oil"
required>



<label>
Tigrinya Name
</label>

<input
type="text"
id="tigrinya"
placeholder="ምሳሌ: ዘይቲ">



<label>
Brand
</label>

<input
type="text"
id="brand"
placeholder="Brand name"
required>



<label>
Category
</label>

<select id="category">

<option>Food</option>
<option>Baby Products</option>
<option>Cleaning</option>
<option>Vegetables & Fruits</option>
<option>Other</option>

</select>




<label>
Product Image
</label>

<input 
type="file"
id="image"
accept="image/*">


<img id="preview"
style="width:150px;margin-top:15px;border-radius:10px;display:none;">





<h3>
Price Options
</h3>


<div id="options">


<div class="option-box">

<input 
class="unit"
placeholder="Example: 1 Liter">

<input 
class="price"
type="number"
placeholder="Price Birr">


</div>


</div>



<button
type="button"
class="btn"
id="add-option-btn">

➕ Add Price Option

</button>



<br><br>


<button 
class="btn add-btn"
type="submit">

💾 Save Product

</button>



</form>


</section>








<script type="module">
  import { db } from "./firebase.js";
import { collection, addDoc, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
console.log("Firebase loaded", db);

// Protect page

if(localStorage.getItem("adminLogin")!=="true"){

window.location.href="admin-login.html";

}



// Image preview

let imageData = "";
let imageInput = document.getElementById("image");
let preview = document.getElementById("preview");


let editingId = localStorage.getItem("editingProductId") || null;


if(editingId){

    let productSnap = await getDoc(
        doc(db, "products", editingId)
    );

    if(productSnap.exists()){

        let product = productSnap.data();

        document.getElementById("name").value = product.name || "";
        document.getElementById("tigrinya").value = product.tigrinya || "";
        document.getElementById("brand").value = product.brand || "";
        document.getElementById("category").value = product.category || "";

        imageData = product.image || "";

        if(imageData){
            preview.src = imageData;
            preview.style.display = "block";
        }

        document.getElementById("options").innerHTML = "";

        product.options.forEach(option => {

            document.getElementById("options").innerHTML += `
            <div class="option-box">
                <input class="unit" value="${option.unit}">
                <input class="price" type="number" value="${option.price}">
            </div>
            `;

        });

    }

}
imageInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (e) {

        imageData = e.target.result;

        preview.src = imageData;

        preview.style.display = "block";

    };

    reader.readAsDataURL(file);

});





// Add price option

function addOption(){

    let box = document.createElement("div");

    box.className = "option-box";

    box.innerHTML = `
        <input class="unit" placeholder="Unit">
        <input class="price" type="number" placeholder="Price Birr">
    `;

    document.getElementById("options").appendChild(box);
}
document
.getElementById("add-option-btn")
.addEventListener("click", addOption);




// Save product

document
.getElementById("product-form")
.addEventListener("submit",async function(e){
alert("Save button connected");

e.preventDefault();



let options=[];


document
.querySelectorAll(".option-box")
.forEach(box=>{


let unit=
box.querySelector(".unit").value;


let price=
box.querySelector(".price").value;



if(unit && price){

options.push({

unit:unit,
price:Number(price)

});


}


});




let product={


id:Date.now(),

name:
document.getElementById("name").value,


tigrinya:
document.getElementById("tigrinya").value,


brand:
document.getElementById("brand").value,


category:
document.getElementById("category").value,


image: imageData || "images/default.jpg",


options:options


};





try {

    if(editingId){

        await updateDoc(
            doc(db, "products", editingId),
            product
        );

        localStorage.removeItem("editingProductId");

    } else {

        await addDoc(
            collection(db, "products"),
            product
        );
        
localStorage.removeItem("editingProductId")
    }

    alert(editingId ? "Product Updated Successfully ✅" : "Product Added Successfully ✅");

    window.location.href = "admin-products.html";

} catch(error) {

    console.error(error);

    alert("Firebase Error: " + error.message);

}




});

</script>


</body>

</html>
